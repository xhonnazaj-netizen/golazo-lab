# Collects this week's fixtures, tables, top scorers, squads with season stats and transfers every night,
# commits them, and the Pages workflow then republishes the app with the fresh data.
name: Collect week data
on:
  schedule:
    - cron: "41 8 * * *"   # 08:41 UTC daily (05:41 in Chile)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["model/collect.mjs", "model/collect-lib.mjs", ".github/workflows/collect.yml"]
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node model/collect.mjs
      - name: Commit the new data if it changed
        run: |
          git add public/week.json model/data/espn-results.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "golazo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Week data update"
          git pull --rebase origin main
          git push
